<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
        .message { display: flex; max-width: 80%; }
        .ai-message { align-self: flex-start; }
        .user-message { align-self: flex-end; flex-direction: row-reverse; }
        .message-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
        }
        .ai-message .message-bubble { background: rgba(255,255,255,0.9); color: #333; border-bottom-left-radius: 6px; }
        .user-message .message-bubble { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-bottom-right-radius: 6px; }
        .loading { display: inline-flex; align-items: center; gap: 8px; }
        .loading-dots { display: flex; gap: 2px; }
        .loading-dots span {
            width: 8px; height: 8px; border-radius: 50%; background: #999;
            animation: loading 1.4s infinite ease-in-out both;
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loading {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .chat-input-container {
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-top: 1px solid rgba(255,255,255,0.2);
            display: flex;
            gap: 12px;
        }
        #messageInput {
            flex: 1; padding: 14px 20px; border: none; border-radius: 25px; font-size: 15px;
            background: rgba(255,255,255,0.9); outline: none;
        }
        #messageInput:focus { background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.3); }
        #sendButton {
            padding: 14px 24px; border: none; border-radius: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-size: 15px;
            cursor: pointer;
        }
        #sendButton:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        #sendButton:disabled { opacity: 0.6; cursor: not-allowed; }
        @media (max-width: 600px) {
            .chat-container { width: 95%; height: 95vh; border-radius: 16px; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                <div class="message-bubble">Hello! Ask me anything...</div>
            </div>
       ව

        <div class="chat-input-container">
            <input type="text" id="messageInput" placeholder="Type your message...">
            <button id="sendButton">Send</button>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.id = 'loading';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble loading';
            bubble.innerHTML = 'AI typing <div class="loading-dots"><span></span><span></span><span></span></div>';
            loadingDiv.appendChild(bubble);
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return loadingDiv;
        }

        async function mockAI(text) {
            await new Promise(r => setTimeout(r, 1500 + Math.random()*1500));
            const responses = [
                `Smart response to "${text}": Yes, that's correct!`,
                `About "${text}": Here's detailed explanation.`,
                `"${text}"? Interesting! My thoughts...`,
                `Response to "${text}": Absolutely.`,
                `Great question "${text}". Answer: Yes.`
            ];
            return responses[Math.floor(Math.random() * 5)];
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            messageInput.value = '';
            sendButton.disabled = true;
            sendButton.textContent = 'AI Thinking...';
            messageInput.disabled = true;
            
            const loading = showLoading();
            try {
                const aiReply = await mockAI(text);
                loading.remove();
                addMessage(aiReply);
            } catch (e) {
                loading.remove();
                addMessage('Error occurred. Try again.');
            }
            sendButton.disabled = false;
            sendButton.textContent = 'Send';
            messageInput.disabled = false;
            messageInput.focus();
        }

        sendButton.onclick = sendMessage;
        messageInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };
        messageInput.focus();
    </script>
</body>
</html>
